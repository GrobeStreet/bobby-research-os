name: Fetch real ANTARES LSST fixtures

on:
  push:
    branches:
      - project/trove-rubin-bridge
    paths:
      - '.github/scripts/fetch_antares_lsst_fixture.py'
      - '.github/workflows/fetch-antares-lsst-fixtures.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/scripts/fetch_antares_lsst_fixture.py'
      - '.github/workflows/fetch-antares-lsst-fixtures.yml'

permissions:
  contents: write

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/trove-rubin-bridge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official ANTARES client
        run: python -m pip install antares-client

      - name: Fetch public LSST loci and freeze fixtures
        run: python .github/scripts/fetch_antares_lsst_fixture.py

      - name: Commit retrieved fixtures
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- projects/trove-rubin-bridge/fixtures/real; then
            echo 'No fixture changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/trove-rubin-bridge/fixtures/real
          git commit -m 'Freeze real ANTARES LSST fixtures'
          git push origin HEAD:project/trove-rubin-bridge
