name: Bootstrap real ANTARES LSST fixtures

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-antares-fixtures.yml'

permissions:
  contents: write

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/trove-rubin-bridge
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official ANTARES client
        run: python -m pip install antares-client

      - name: Fetch public LSST loci and freeze fixtures
        run: python .github/scripts/fetch_antares_lsst_fixture.py

      - name: Commit retrieved fixtures to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/trove-rubin-bridge/fixtures/real
          if git diff --cached --quiet; then
            echo 'No fixture changes to commit.'
            exit 0
          fi
          git commit -m 'Freeze real ANTARES LSST fixtures'
          git push origin HEAD:project/trove-rubin-bridge
