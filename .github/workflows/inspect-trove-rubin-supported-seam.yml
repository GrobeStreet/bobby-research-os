name: Inspect TROVE Rubin supported seam

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/trove-rubin-supported-seam
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'django==5.2.13' 'antares-client==1.14.0' 'tom-alertstreams==1.2.1'
      - name: Inspect runtime seam
        shell: bash
        run: |
          set -o pipefail
          python projects/trove-rubin-bridge/supported_seam/inspect_runtime.py | tee /tmp/supported-seam.txt
