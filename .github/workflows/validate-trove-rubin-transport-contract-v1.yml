name: Validate TROVE Rubin transport contract v1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/trove-rubin-transport-contract-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run hostile acknowledgement contract tests
        shell: bash
        run: |
          set -o pipefail
          cd projects/trove-rubin-bridge/transport_contract_v1
          python -m pytest -q | tee /tmp/transport-contract-v1.txt
      - name: Static invariant scan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/trove-rubin-bridge/transport_contract_v1/transport_contract.py')
          text = p.read_text()
          assert 'if not receipt.durable' in text
          assert 'cannot poll past an unresolved delivery' in text
          assert 'explicit trigger_alert is required' in text
          assert 'consumer_group is required' in text
          assert 'acknowledge(raw.position)' in text
          print('transport contract static invariants present')
          PY
