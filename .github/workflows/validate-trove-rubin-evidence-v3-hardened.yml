name: Validate TROVE Rubin evidence v3 strict

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: trove_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout bridge staging branch
        uses: actions/checkout@v4
        with:
          ref: project/trove-rubin-bridge
          path: bridge
          fetch-depth: 0
      - name: Checkout clean TROVE main
        uses: actions/checkout@v4
        with:
          repository: astro-trove/trove
          ref: main
          path: trove
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build strict patch, validate, freeze, and independently verify exact file
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/bridge/projects/trove-rubin-bridge"
          OUTDIR="$ROOT/upstream_patch_v3"
          PATCH="$OUTDIR/0001-rubin-split-evidence-boundary.patch"
          OUT="$OUTDIR/validation-output-strict.txt"
          STATUS="$OUTDIR/validation-status-strict.json"
          : > "$OUT"
          TROVE_SHA="$(git -C trove rev-parse HEAD)"
          BRIDGE_SHA="$(git -C bridge rev-parse HEAD)"
          TNLE_SHA="d877e0281c6c826d753b19442a7452dbaafb00c5"

          echo '=== clean-source identity ===' | tee -a "$OUT"
          echo "trove_commit=$TROVE_SHA" | tee -a "$OUT"
          echo "bridge_commit=$BRIDGE_SHA" | tee -a "$OUT"
          test -z "$(git -C trove status --porcelain)"
          CLEAN_SOURCE_STATUS=$?

          python - <<'PY'
          from pathlib import Path
          src = Path('trove/requirements.txt').read_text().splitlines()
          pin = 'tom-nonlocalizedevents @ git+https://github.com/TOMToolkit/tom_nonlocalizedevents.git@d877e0281c6c826d753b19442a7452dbaafb00c5'
          Path('/tmp/trove-repro-requirements.txt').write_text('\n'.join(pin if line.startswith('tom-nonlocalizedevents @') else line for line in src) + '\n')
          PY
          python -m pip install --upgrade pip wheel setuptools 2>&1 | tee -a "$OUT"
          python -m pip install -r /tmp/trove-repro-requirements.txt pytest pytest-django 2>&1 | tee -a "$OUT"
          INSTALL_STATUS=${PIPESTATUS[0]}

          write_settings() {
            local root="$1"
            cat > "$root/trove_tom/settings_local.py" <<'EOF'
          ALLOWED_HOST = 'localhost'
          ATLAS_API_KEY = ''
          DEBUG = True
          FORCE_SCRIPT_NAME = ''
          GCN_CLIENT_ID = ''
          GCN_CLIENT_SECRET = ''
          HOPSKOTCH_GROUP_ID = 'ci-test'
          LASAIR_TOKEN = ''
          POSTGRES_DB = ''
          POSTGRES_HOST = ''
          POSTGRES_PASSWORD = ''
          POSTGRES_PORT = 5432
          POSTGRES_USER = ''
          POSTGRES_DB2 = ''
          POSTGRES_HOST2 = ''
          POSTGRES_PASSWORD2 = ''
          POSTGRES_PORT2 = 5432
          POSTGRES_USER2 = ''
          SAVE_TEST_ALERTS = False
          SCIMMA_AUTH_USERNAME = ''
          SCIMMA_AUTH_PASSWORD = ''
          SECRET_KEY = 'ci-test-secret-key-not-for-production'
          NLE_LINKS = []
          TARGET_LINKS = []
          SLACK_TOKENS_GW = []
          SLACK_TOKEN_EP = ''
          SLACK_TOKEN_TNS = ''
          TNS_API_KEY = ''
          TREASUREMAP_API_KEY = ''
          ZTF_INFO = {'email_server':'', 'email_password':'', 'email_address':'', 'user_address':'', 'user_password':''}
          EOF
          }
          write_settings trove

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            python <<'PY' 2>&1 | tee -a "$OUT"
          import os, site
          patches = [
              (('tom_targets','migrations','0025_auto_20250206_2017.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_targets','0024_basetarget_permissions')]\n    operations=[]\n"),
              (('tom_nonlocalizedevents','migrations','0016_externalcoincidence_alter_eventsequence_options_and_more.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_nonlocalizedevents','0015_eventsequence_and_more')]\n    operations=[]\n"),
              (('tom_nonlocalizedevents','migrations','0017_alter_eventsequence_external_coincidence_and_more.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_nonlocalizedevents','0016_externalcoincidence_alter_eventsequence_options_and_more')]\n    operations=[]\n"),
          ]
          for parts, content in patches:
              for sp in site.getsitepackages():
                  path=os.path.join(sp,*parts)
                  if os.path.exists(path):
                      open(path,'w').write(content)
                      print('patched', path)
                      break
          PY
          fi

          echo '=== strict builder only ===' | tee -a "$OUT"
          if [ "$INSTALL_STATUS" -eq 0 ] && [ "$CLEAN_SOURCE_STATUS" -eq 0 ]; then
            TROVE_RUBIN_BRIDGE_ROOT="$ROOT" TROVE_ROOT="$GITHUB_WORKSPACE/trove" python "$OUTDIR/run_hardened_v3_strict.py" 2>&1 | tee -a "$OUT"
            BUILD_STATUS=${PIPESTATUS[0]}
          else
            BUILD_STATUS=99
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            git -C trove reset --hard "$TROVE_SHA" 2>&1 | tee -a "$OUT"
            git -C trove clean -fd 2>&1 | tee -a "$OUT"
            write_settings trove
            git -C trove apply --check "$PATCH" 2>&1 | tee -a "$OUT"
            APPLY_CHECK_STATUS=${PIPESTATUS[0]}
          else
            APPLY_CHECK_STATUS=99
          fi
          if [ "$APPLY_CHECK_STATUS" -eq 0 ]; then
            git -C trove apply "$PATCH" 2>&1 | tee -a "$OUT"
            APPLY_STATUS=${PIPESTATUS[0]}
          else
            APPLY_STATUS=99
          fi

          echo '=== sqlite / migration / full TROVE ===' | tee -a "$OUT"
          if [ "$APPLY_STATUS" -eq 0 ]; then
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py check) 2>&1 | tee -a "$OUT"
            CHECK_STATUS=${PIPESTATUS[0]}
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py makemigrations custom_code --check --dry-run) 2>&1 | tee -a "$OUT"
            MIGRATION_STATUS=${PIPESTATUS[0]}
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python -m pytest tests/test_rubin_split_evidence.py -q) 2>&1 | tee -a "$OUT"
            SQLITE_FOCUSED=${PIPESTATUS[0]}
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python -m pytest tests/ -q) 2>&1 | tee -a "$OUT"
            SQLITE_FULL=${PIPESTATUS[0]}
          else
            CHECK_STATUS=99; MIGRATION_STATUS=99; SQLITE_FOCUSED=99; SQLITE_FULL=99
          fi

          echo '=== PostgreSQL focused including concurrency ===' | tee -a "$OUT"
          psql -h 127.0.0.1 -U postgres -d postgres -c 'DROP DATABASE IF EXISTS catalogs_ci;' 2>&1 | tee -a "$OUT"
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE catalogs_ci;' 2>&1 | tee -a "$OUT"
          if [ "$APPLY_STATUS" -eq 0 ]; then
            (cd trove && \
              POSTGRES_DB='trove_ci' POSTGRES_HOST='127.0.0.1' POSTGRES_PASSWORD='postgres' POSTGRES_PORT='5432' POSTGRES_USER='postgres' \
              POSTGRES_DB2='catalogs_ci' POSTGRES_HOST2='127.0.0.1' POSTGRES_PASSWORD2='postgres' POSTGRES_PORT2='5432' POSTGRES_USER2='postgres' \
              SKIP_DUSTMAP=1 python -m pytest tests/test_rubin_split_evidence.py -q) 2>&1 | tee -a "$OUT"
            POSTGRES_FOCUSED=${PIPESTATUS[0]}
          else
            POSTGRES_FOCUSED=99
          fi

          PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
          echo "strict_patch_sha256=$PATCH_SHA" | tee -a "$OUT"
          cat > "$STATUS" <<EOF
          {
            "clean_source_status": $CLEAN_SOURCE_STATUS,
            "install_status": $INSTALL_STATUS,
            "build_status": $BUILD_STATUS,
            "apply_check_status": $APPLY_CHECK_STATUS,
            "apply_status": $APPLY_STATUS,
            "django_check_status": $CHECK_STATUS,
            "migration_check_status": $MIGRATION_STATUS,
            "sqlite_focused_status": $SQLITE_FOCUSED,
            "sqlite_full_status": $SQLITE_FULL,
            "postgres_focused_status": $POSTGRES_FOCUSED,
            "trove_commit": "$TROVE_SHA",
            "bridge_commit_before_results": "$BRIDGE_SHA",
            "tom_nonlocalizedevents_reproduction_pin": "$TNLE_SHA",
            "canonicalization_protocol": "alert-v2/context-v2",
            "patch_sha256": "$PATCH_SHA"
          }
          EOF

          mkdir -p /tmp/trove-rubin-strict-artifacts
          cp "$PATCH" "$OUT" "$STATUS" /tmp/trove-rubin-strict-artifacts/

          echo '=== freeze sole canonical publisher ===' | tee -a "$OUT"
          git -C bridge fetch origin project/trove-rubin-bridge
          git -C bridge reset --hard origin/project/trove-rubin-bridge
          cp /tmp/trove-rubin-strict-artifacts/0001-rubin-split-evidence-boundary.patch "$PATCH"
          cp /tmp/trove-rubin-strict-artifacts/validation-output-strict.txt "$OUT"
          cp /tmp/trove-rubin-strict-artifacts/validation-status-strict.json "$STATUS"
          git -C bridge config user.name 'github-actions[bot]'
          git -C bridge config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C bridge add projects/trove-rubin-bridge/upstream_patch_v3/
          git -C bridge commit -m 'Freeze strict v2 Rubin evidence patch' || true
          git -C bridge push origin HEAD:project/trove-rubin-bridge
          PUBLISH_STATUS=$?

          echo '=== independent frozen-file verification ===' | tee -a "$OUT"
          git clone --quiet https://github.com/astro-trove/trove.git verify-trove
          git -C verify-trove checkout --quiet "$TROVE_SHA"
          write_settings verify-trove
          FROZEN_PATCH="$GITHUB_WORKSPACE/bridge/projects/trove-rubin-bridge/upstream_patch_v3/0001-rubin-split-evidence-boundary.patch"
          FROZEN_STATUS="$GITHUB_WORKSPACE/bridge/projects/trove-rubin-bridge/upstream_patch_v3/validation-status-strict.json"
          FROZEN_SHA="$(sha256sum "$FROZEN_PATCH" | awk '{print $1}')"
          RECORDED_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["patch_sha256"])' "$FROZEN_STATUS")"
          test "$FROZEN_SHA" = "$PATCH_SHA" && test "$FROZEN_SHA" = "$RECORDED_SHA"
          VERIFY_SHA_STATUS=$?
          git -C verify-trove apply --check "$FROZEN_PATCH" 2>&1 | tee -a "$OUT"
          VERIFY_APPLY_CHECK=${PIPESTATUS[0]}
          if [ "$VERIFY_APPLY_CHECK" -eq 0 ]; then
            git -C verify-trove apply "$FROZEN_PATCH" 2>&1 | tee -a "$OUT"
            VERIFY_APPLY=${PIPESTATUS[0]}
          else
            VERIFY_APPLY=99
          fi
          if [ "$VERIFY_APPLY" -eq 0 ]; then
            (cd verify-trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py makemigrations custom_code --check --dry-run) 2>&1 | tee -a "$OUT"
            VERIFY_MIGRATION=${PIPESTATUS[0]}
            (cd verify-trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python -m pytest tests/test_rubin_split_evidence.py -q) 2>&1 | tee -a "$OUT"
            VERIFY_SQLITE=${PIPESTATUS[0]}
            psql -h 127.0.0.1 -U postgres -d postgres -c 'DROP DATABASE IF EXISTS trove_verify;'
            psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE trove_verify;'
            psql -h 127.0.0.1 -U postgres -d postgres -c 'DROP DATABASE IF EXISTS catalogs_verify;'
            psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE catalogs_verify;'
            (cd verify-trove && \
              POSTGRES_DB='trove_verify' POSTGRES_HOST='127.0.0.1' POSTGRES_PASSWORD='postgres' POSTGRES_PORT='5432' POSTGRES_USER='postgres' \
              POSTGRES_DB2='catalogs_verify' POSTGRES_HOST2='127.0.0.1' POSTGRES_PASSWORD2='postgres' POSTGRES_PORT2='5432' POSTGRES_USER2='postgres' \
              SKIP_DUSTMAP=1 python -m pytest tests/test_rubin_split_evidence.py -q) 2>&1 | tee -a "$OUT"
            VERIFY_POSTGRES=${PIPESTATUS[0]}
          else
            VERIFY_MIGRATION=99; VERIFY_SQLITE=99; VERIFY_POSTGRES=99
          fi

          echo "verify_sha_status=$VERIFY_SHA_STATUS" | tee -a "$OUT"
          echo "verify_apply_check=$VERIFY_APPLY_CHECK" | tee -a "$OUT"
          echo "verify_apply=$VERIFY_APPLY" | tee -a "$OUT"
          echo "verify_migration=$VERIFY_MIGRATION" | tee -a "$OUT"
          echo "verify_sqlite=$VERIFY_SQLITE" | tee -a "$OUT"
          echo "verify_postgres=$VERIFY_POSTGRES" | tee -a "$OUT"

          if [ "$CLEAN_SOURCE_STATUS" -ne 0 ] || [ "$INSTALL_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$APPLY_CHECK_STATUS" -ne 0 ] || [ "$APPLY_STATUS" -ne 0 ] || [ "$CHECK_STATUS" -ne 0 ] || [ "$MIGRATION_STATUS" -ne 0 ] || [ "$SQLITE_FOCUSED" -ne 0 ] || [ "$SQLITE_FULL" -ne 0 ] || [ "$POSTGRES_FOCUSED" -ne 0 ] || [ "$PUBLISH_STATUS" -ne 0 ] || [ "$VERIFY_SHA_STATUS" -ne 0 ] || [ "$VERIFY_APPLY_CHECK" -ne 0 ] || [ "$VERIFY_APPLY" -ne 0 ] || [ "$VERIFY_MIGRATION" -ne 0 ] || [ "$VERIFY_SQLITE" -ne 0 ] || [ "$VERIFY_POSTGRES" -ne 0 ]; then exit 1; fi
