name: Validate TROVE Rubin evidence v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge staging branch
        uses: actions/checkout@v4
        with:
          ref: project/trove-rubin-bridge
          path: bridge
          fetch-depth: 0

      - name: Checkout TROVE main
        uses: actions/checkout@v4
        with:
          repository: astro-trove/trove
          ref: main
          path: trove
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and validate exact evidence patch
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/bridge/projects/trove-rubin-bridge"
          OUTDIR="$ROOT/upstream_patch_v2"
          PATCH="$OUTDIR/0001-rubin-evidence-core.patch"
          OUT="$OUTDIR/validation-output.txt"
          STATUS="$OUTDIR/validation-status.json"
          : > "$OUT"

          TROVE_SHA="$(git -C trove rev-parse HEAD)"
          BRIDGE_SHA="$(git -C bridge rev-parse HEAD)"
          TNLE_SHA="d877e0281c6c826d753b19442a7452dbaafb00c5"

          echo '=== environment ===' | tee -a "$OUT"
          python --version 2>&1 | tee -a "$OUT"
          echo "trove_commit=$TROVE_SHA" | tee -a "$OUT"
          echo "bridge_commit=$BRIDGE_SHA" | tee -a "$OUT"
          echo "tom_nonlocalizedevents_reproduction_pin=$TNLE_SHA" | tee -a "$OUT"

          python - <<'PY'
          from pathlib import Path
          src = Path('trove/requirements.txt').read_text().splitlines()
          pin = 'tom-nonlocalizedevents @ git+https://github.com/TOMToolkit/tom_nonlocalizedevents.git@d877e0281c6c826d753b19442a7452dbaafb00c5'
          Path('/tmp/trove-repro-requirements.txt').write_text('\n'.join(pin if line.startswith('tom-nonlocalizedevents @') else line for line in src) + '\n')
          PY

          python -m pip install --upgrade pip wheel setuptools 2>&1 | tee -a "$OUT"
          python -m pip install -r /tmp/trove-repro-requirements.txt pytest pytest-django 2>&1 | tee -a "$OUT"
          INSTALL_STATUS=${PIPESTATUS[0]}

          cat > trove/trove_tom/settings_local.py <<'EOF'
          ALLOWED_HOST = 'localhost'
          ATLAS_API_KEY = ''
          DEBUG = True
          FORCE_SCRIPT_NAME = ''
          GCN_CLIENT_ID = ''
          GCN_CLIENT_SECRET = ''
          HOPSKOTCH_GROUP_ID = 'ci-test'
          LASAIR_TOKEN = ''
          POSTGRES_DB = ''
          POSTGRES_HOST = ''
          POSTGRES_PASSWORD = ''
          POSTGRES_PORT = 5432
          POSTGRES_USER = ''
          POSTGRES_DB2 = ''
          POSTGRES_HOST2 = ''
          POSTGRES_PASSWORD2 = ''
          POSTGRES_PORT2 = 5432
          POSTGRES_USER2 = ''
          SAVE_TEST_ALERTS = False
          SCIMMA_AUTH_USERNAME = ''
          SCIMMA_AUTH_PASSWORD = ''
          SECRET_KEY = 'ci-test-secret-key-not-for-production'
          NLE_LINKS = []
          TARGET_LINKS = []
          SLACK_TOKENS_GW = []
          SLACK_TOKEN_EP = ''
          SLACK_TOKEN_TNS = ''
          TNS_API_KEY = ''
          TREASUREMAP_API_KEY = ''
          ZTF_INFO = {'email_server':'', 'email_password':'', 'email_address':'', 'user_address':'', 'user_password':''}
          EOF

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            echo '=== patch upstream migrations exactly as TROVE CI ===' | tee -a "$OUT"
            python <<'PY' 2>&1 | tee -a "$OUT"
          import os, site
          patches = [
              (('tom_targets','migrations','0025_auto_20250206_2017.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_targets','0024_basetarget_permissions')]\n    operations=[]\n"),
              (('tom_nonlocalizedevents','migrations','0016_externalcoincidence_alter_eventsequence_options_and_more.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_nonlocalizedevents','0015_eventsequence_and_more')]\n    operations=[]\n"),
              (('tom_nonlocalizedevents','migrations','0017_alter_eventsequence_external_coincidence_and_more.py'), "from django.db import migrations\nclass Migration(migrations.Migration):\n    dependencies=[('tom_nonlocalizedevents','0016_externalcoincidence_alter_eventsequence_options_and_more')]\n    operations=[]\n"),
          ]
          for parts, content in patches:
              for sp in site.getsitepackages():
                  path=os.path.join(sp,*parts)
                  if os.path.exists(path):
                      open(path,'w').write(content)
                      print('patched', path)
                      break
          PY
          fi

          echo '=== build exact v2 patch ===' | tee -a "$OUT"
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            TROVE_RUBIN_BRIDGE_ROOT="$ROOT" TROVE_ROOT="$GITHUB_WORKSPACE/trove" python "$OUTDIR/build_evidence_patch.py" 2>&1 | tee -a "$OUT"
            BUILD_STATUS=${PIPESTATUS[0]}
          else
            BUILD_STATUS=99
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo '=== frozen changed files ===' | tee -a "$OUT"
            cat "$OUTDIR/changed-files.txt" | tee -a "$OUT"
            git -C trove reset --hard HEAD 2>&1 | tee -a "$OUT"
            git -C trove clean -fd 2>&1 | tee -a "$OUT"
            git -C trove apply --check "$PATCH" 2>&1 | tee -a "$OUT"
            APPLY_CHECK_STATUS=${PIPESTATUS[0]}
          else
            APPLY_CHECK_STATUS=99
          fi

          if [ "$APPLY_CHECK_STATUS" -eq 0 ]; then
            git -C trove apply "$PATCH" 2>&1 | tee -a "$OUT"
            APPLY_STATUS=${PIPESTATUS[0]}
          else
            APPLY_STATUS=99
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo '=== django check ===' | tee -a "$OUT"
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py check) 2>&1 | tee -a "$OUT"
            CHECK_STATUS=${PIPESTATUS[0]}
          else
            CHECK_STATUS=99
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo '=== migration consistency ===' | tee -a "$OUT"
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py makemigrations --check --dry-run) 2>&1 | tee -a "$OUT"
            MIGRATION_CHECK_STATUS=${PIPESTATUS[0]}
          else
            MIGRATION_CHECK_STATUS=99
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo '=== migrate clean database ===' | tee -a "$OUT"
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python manage.py migrate --run-syncdb --noinput) 2>&1 | tee -a "$OUT"
            MIGRATE_STATUS=${PIPESTATUS[0]}
          else
            MIGRATE_STATUS=99
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo '=== focused Rubin evidence tests ===' | tee -a "$OUT"
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python -m pytest tests/test_rubin_evidence.py -q) 2>&1 | tee -a "$OUT"
            FOCUSED_STATUS=${PIPESTATUS[0]}
          else
            FOCUSED_STATUS=99
          fi

          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo '=== existing TROVE test suite ===' | tee -a "$OUT"
            (cd trove && POSTGRES_DB='' SKIP_DUSTMAP=1 python -m pytest tests/ -q) 2>&1 | tee -a "$OUT"
            FULL_STATUS=${PIPESTATUS[0]}
          else
            FULL_STATUS=99
          fi

          if [ -f "$PATCH" ]; then
            PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
          else
            PATCH_SHA=""
          fi

          cat > "$STATUS" <<EOF
          {
            "install_status": $INSTALL_STATUS,
            "build_status": $BUILD_STATUS,
            "apply_check_status": $APPLY_CHECK_STATUS,
            "apply_status": $APPLY_STATUS,
            "django_check_status": $CHECK_STATUS,
            "migration_check_status": $MIGRATION_CHECK_STATUS,
            "migrate_status": $MIGRATE_STATUS,
            "focused_test_status": $FOCUSED_STATUS,
            "full_trove_test_status": $FULL_STATUS,
            "trove_commit": "$TROVE_SHA",
            "bridge_commit_before_results": "$BRIDGE_SHA",
            "tom_nonlocalizedevents_reproduction_pin": "$TNLE_SHA",
            "patch_sha256": "$PATCH_SHA"
          }
          EOF

          git -C bridge config user.name 'github-actions[bot]'
          git -C bridge config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C bridge add projects/trove-rubin-bridge/upstream_patch_v2/0001-rubin-evidence-core.patch projects/trove-rubin-bridge/upstream_patch_v2/changed-files.txt projects/trove-rubin-bridge/upstream_patch_v2/validation-output.txt projects/trove-rubin-bridge/upstream_patch_v2/validation-status.json
          git -C bridge commit -m 'Freeze validated v2 Rubin evidence patch' || true
          git -C bridge push origin HEAD:project/trove-rubin-bridge

          if [ "$INSTALL_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$APPLY_CHECK_STATUS" -ne 0 ] || [ "$APPLY_STATUS" -ne 0 ] || [ "$CHECK_STATUS" -ne 0 ] || [ "$MIGRATION_CHECK_STATUS" -ne 0 ] || [ "$MIGRATE_STATUS" -ne 0 ] || [ "$FOCUSED_STATUS" -ne 0 ] || [ "$FULL_STATUS" -ne 0 ]; then exit 1; fi
