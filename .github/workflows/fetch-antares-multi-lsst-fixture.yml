name: Fetch multi-alert ANTARES LSST fixture

on:
  push:
    branches:
      - project/trove-rubin-bridge
    paths:
      - '.github/scripts/fetch_antares_multi_lsst_fixture.py'
      - '.github/workflows/fetch-antares-multi-lsst-fixture.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/trove-rubin-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official ANTARES client
        run: python -m pip install antares-client
      - name: Search live ANTARES for multi-alert Rubin locus
        run: python .github/scripts/fetch_antares_multi_lsst_fixture.py
      - name: Freeze fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/trove-rubin-bridge/fixtures/real_multi
          git commit -m 'Freeze real multi-alert ANTARES LSST fixture'
          git push origin HEAD:project/trove-rubin-bridge
